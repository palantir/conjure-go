types:
  definitions:
    default-package: api
    errors:
      MyNotFound:
        docs: Something was not found.
        code: NOT_FOUND
        namespace: MyNamespace
        safe-args:
          safeArgA:
            type: Basic
            docs: This is safeArgA doc.
          safeArgB:
            type: list<integer>
            docs: This is safeArgB doc.
          type:
            type: string
            docs: A field named with a go keyword
        unsafe-args:
          unsafeArgA: string
          unsafeArgB: optional<string>
      MyInternal:
        docs: Internal server error.
        code: INTERNAL
        namespace: MyNamespace
        safe-args:
          safeArgA:
            type: Basic
            docs: This is safeArgA doc.
          safeArgB:
            type: list<integer>
            docs: This is safeArgB doc.
          type:
            type: string
            docs: A field named with a go keyword
        unsafe-args:
          unsafeArgA: string
          unsafeArgB: optional<string>
          # An argument with the same (case-insensitive) name as the error type.
          myInternal: string
      MyPermissionDenied:
        docs: Permission denied error.
        code: PERMISSION_DENIED
        namespace: MyNamespace
    objects:
      Basic:
        fields:
          data: string
services:
  ErrorTestService:
    name: Error Test Service
    package: api
    endpoints:
      getBasic:
        docs: An endpoint that returns a Basic and can throw MyNotFound.
        http: GET /basic/{id}
        args:
          id: string
        returns: Basic
        errors:
          - error: MyNotFound
            docs: returned when getBasic can not find the thing
      putBasic:
        docs: An endpoint that can throw both MyNotFound and MyInternal.
        http: PUT /basic/{id}
        args:
          id: string
          body:
            type: Basic
            param-type: body
        errors:
          - error: MyPermissionDenied
          - error: MyNotFound
            docs: returned when putBasic can not find the thing
          - error: MyInternal
            docs: returned when putBasic fails
      deleteBasic:
        docs: An endpoint with no declared errors (uses global decoder).
        http: DELETE /basic/{id}
        args:
          id: string
