# This file was generated by the excavator check 'excavator/manage-circleci' as specified in .circleci/template.sh.
# To request a modification to the general template, file an issue on Excavator.
# To manually manage the CircleCI configuration for this project, remove the .circleci/template.sh file.

version: 2.1

orbs:
  go-jobs: palantir/go-jobs@0.10.0

image-version: &image-version "cimg/go:1.26.6-browsers"

java-version-setup_steps: &java-version-setup_steps
  setup_steps:
    - go-jobs/default_setup_steps
    - run:
        name: Install OpenJDK 17
        command: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          sudo rm -rf /var/lib/apt/lists/*
    - run:
        name: Verify Java installation
        command: java --version

executors:
  standard-executor:
    docker:
      - image: *image-version
    working_directory: /home/circleci/go/src/github.com/palantir/conjure-go
    resource_class: medium
  circleci-go-with-conjure-verifier:
    docker:
      - image: *image-version
      - image: palantirtechnologies/conjure-verification-server:0.18.5
    working_directory: /home/circleci/go/src/github.com/palantir/conjure-go

# Filter that matches all tags (will run on every build).
all-tags-filter: &all-tags-filter
  filters:
    tags:
      only: /.*/

# Filter that matches any branch besides primary branch and ignores all tags except for release candidates
pull-request-filter: &pull-request-filter
  filters:
    tags:
      only: /.*-rc.*/
    branches:
      ignore:
        - develop

requires_jobs: &requires_jobs
  - build
  - verify
  - test
  - dist
  - conjure-verifier

workflows:
  version: 2
  verify:
    jobs:
      - go-jobs/godel_build:
          name: "build"
          executor: "standard-executor"
          <<: *java-version-setup_steps
          <<: *all-tags-filter
      - go-jobs/godel_verify:
          name: "verify"
          executor: "standard-executor"
          <<: *java-version-setup_steps
          skip_tests: true
          requires:
            - build
          <<: *all-tags-filter
      - go-jobs/godel_test:
          name: "test"
          executor: "standard-executor"
          <<: *java-version-setup_steps
          test_flags: "--tags=none"
          requires:
            - build
          <<: *all-tags-filter
      - go-jobs/godel_test:
          name: "conjure-verifier"
          executor: "circleci-go-with-conjure-verifier"
          <<: *java-version-setup_steps
          test_flags: "--tags=conjure-verifier"
          requires:
            - build
          <<: *all-tags-filter
      - go-jobs/godel_dist:
          name: "dist"
          executor: "standard-executor"
          <<: *java-version-setup_steps
          requires:
            - build
          <<: *all-tags-filter
      - go-jobs/circle_all:
          name: "circle-all"
          image: "busybox:1.36.1"
          requires: *requires_jobs
          <<: *pull-request-filter
